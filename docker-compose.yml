services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    environment:
      # Override .env's localhost values - inside the compose network, services reach each
      # other by service name, not localhost.
      MONGO_URL: mongodb://mongo:27017
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - mongo
      - redis
    volumes:
      # Persists the downloaded faster-whisper model across container restarts/rebuilds,
      # so it isn't re-downloaded (~150MB) every time the api container starts.
      - whisper_cache:/root/.cache/huggingface

volumes:
  mongo_data:
  redis_data:
  whisper_cache:
